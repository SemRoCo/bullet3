[build-system]
requires = [
    "setuptools>=42",
    "scikit_build",
    "wheel",
    "pybind11>=2.6.0,<2.10",
    "numpy>=1.20",
]
build-backend = "setuptools.build_meta"

[project]
name = "betterpybullet"
version = "0.1.0"

[tool.scikit-build]
cmake.args = [
    "-DBUILD_PYBULLET=ON",
    "-DBUILD_PYBULLET_NUMPY=ON",
    "-DBT_ENABLE_VHACD=TRUE",
    "-DUSE_DOUBLE_PRECISION=ON",
    "-DBT_USE_EGL=ON",
    "-DCMAKE_BUILD_TYPE=Release"
]